<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>University Registation Form</h1>
    <p>Please fill out the form below to register</p>
    <hr>

    <h2>Personal Detail</h2>

    <form>
        <label for="name">First Name:</label>
        <input type="text" name="userName" id="name" placeholder="e.g.,Arjun"> <!--placeholder means usme kuch example dal dete hai -->
        <br><br>

        <label for="lname">Last Name:</label>
        <input type="text" name="userName" id="lname" placeholder="e.g.Kumar">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob" required> <!--required means-> us box me bharna hi bharna hai-->
        <br><br>

        <p>Gender:</p>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">
        <br>

        <label for="Female">Female</label>
        <input type="radio" name="gender" id="Female" value="female">
        <br>

        <label for="Female">Female</label>
        <input type="radio" name="gender" id="Female" value="female">
        <br><br>

        <label for="photo">Upload Your Photo:</label>
        <input type="file" name="file" id="photo">
        <hr>

        <h2>Contact Information</h2>
        <label for="email">Email Address:</label>
        <input type="email" name="email" id="email" placeholder="you@example.com">
        <br><br>

        <label for="phone">Email Address:</label>
        <input type="tel" name="phone" id="phone" placeholder="e.g.,xxxxxxxxxx" >
        <br><br>

        <label for="Address">Mailing Address:</label>
        <br>
        <textarea name="Address" id="Address" placeholder="Street Address, City, State, PIN code"></textarea> <!--textarea means -> janha per bahut sare text ko dalna hai-->

        <hr>
        <h2>Academic Information</h2>
        <label for="course">Select Your Course:</label>
        <select name="course" id="course"> <!--select-> isme kon sa course lena chahte ho usko select karna hai-->
            <option value="CST">CST</option>
            <option value="ME">ME</option>
            <option value="CE">CE</option>
        </select>

        <br>

        <h4>Extracurricular Interests:</h4>
        <label for="Sports">Sports</label>
        <input type="checkbox" name="interest" id="Sports" value="Sports">
        <br>

        <label for="Music">Music & Arts</label>
        <input type="checkbox" name="interest" id="Music" value="Music">
        <br>

        <label for="Technology">Technology Clubs</label>
        <input type="checkbox" name="interest" id="Technology" value="Technology">
        <br>

        <label for="Voluntering">Voluntering</label>
        <input type="checkbox" name="interest" id="Voluntering" value="Voluntering">
        <br><br>

        <hr>

        <h2>Create Your Account</h2>
        <label for="pass">Create a Password:</label>
        <input type="password" name="password" id="pass">
        <br><br>

        <label for="Question">Security Question:</label>
        <select name="Security" id="Question">
            <option value="name">What was your first pet's name</option>
            <option value="movie">What is your favorite movie</option>
            <option value="sport">What is your favorite sport</option>
        </select>
        <br><br>

        <label for="ans">Security Answer:</label>
        <input type="text" name="Security" id="ans">
        <br><br>

        <label for="Terms and Conditions">I agree to the Terms and Conditions.</label>
        <input type="checkbox" name="agree" id="Terms and Conditions">

        <hr>

        <button type="submit">Regiter</button>
        <button type="reset">Clear Form</button>









    </form>
    
</body>
</html>
