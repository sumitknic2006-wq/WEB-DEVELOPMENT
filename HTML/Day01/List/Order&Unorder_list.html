<!--Order_list(ol) means jo bhi list ke content me mension kiya usko automatically number mil jata hai-->
<ol>
    <li>Milk</li>
    <li>Sugar</li>
    <li>Chaipatti</li>
    <li>Water</li>
</ol>
<!--Unorder_list(ol) means jo bhi list ke content me mension kiya usko number nahi milta hai-->
<ul>
    <li>Milk</li>
    <li>Sugar</li>
    <li>Chaipatti</li>
    <li>Water</li>
</ul>
