<table border="1">
    <thead> <!--header part hota hai-->
    <tr>
        <th>Item</th> <!--th means table ke heading ko darshata hai-->
        <th>Quantity</th>
        <th>Price</th>
    </tr>
    </thead>

    <tbody> <!--actual content hota hai-->
    <tr>
        <td>Apple</td>
        <td>10</td>
        <td>$1.00</td>
    </tr>
    </tbody>
    <tr>
        <td>Orange</td>
        <td>5</td>
        <td>$1.20</td>
    </tr>
    </tbody>

    <tfoot> <!--Conculusion batata hai table ka-->
    <tr>
        <td>Total</td>
        <td>15</td>
        <td>&2.50</td>
    </tr>
    </tfoot>



</table>
